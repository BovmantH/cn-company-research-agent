schema: spec-driven

context: |
  项目: cn-company-research(中文公司调研 Agent)
  来源: fork 自 guy-hartstein/company-research-agent (MIT License)
  目标: 把这个英文版的 LangGraph + Tavily 多 agent 公司调研工具
        本地化为面向中文用户、调研中国公司的版本。

  技术栈:
  - 后端: Python 3, FastAPI, LangChain v1, LangGraph
  - 前端: React + TypeScript + Vite + Tailwind
  - 检索: Tavily(待替换为国内/中文友好方案)
  - LLM: OpenAI GPT-5.1 / GPT-4o + Google Gemini 2.5 Flash
        (待评估是否替换为国产模型)
  - 持久化: MongoDB(可选)

  核心架构(LangGraph 节点):
    grounding → [financial_analyst, news_scanner, industry_analyst, company_analyst]
              → collector → curator → enricher → briefing → editor

  约定:
  - 所有 prompt 集中在 backend/prompts.py
  - LLM 调用点在 backend/nodes/researchers/base.py, briefing.py, editor.py
  - Tavily 调用分散在 backend/nodes/ 和 backend/utils/references.py
  - 前端没有 i18n,字符串硬编码在 ui/src/components/*.tsx
  - 提交信息使用中文,遵循 conventional commits

rules:
  proposal:
    - 用中文撰写
    - 必须包含"范围(In/Out of Scope)"小节
    - 必须列出受影响的文件清单
  tasks:
    - 单个任务控制在 1-2 小时以内
    - 涉及 LLM/Search provider 的改动必须保留 fallback 路径

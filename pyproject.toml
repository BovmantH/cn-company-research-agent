[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
    "docs/superpowers/specs",
    "openspec",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "S105",
    "S106",
    "S107",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S107"]
"backend/services/company_intelligence/config.py" = ["S105"]
